[project]
name = "ambient-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10",
    "asyncpg>=0.31.0",
    "boto3>=1.42.73",
    "e2b>=2.25.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymilvus[milvus-lite]>=2.6.10",
    "python-multipart>=0.0.32",
    "redis>=8.0.0",
    "rich>=13.9",
    "setuptools<81",
    "sqlite-vec>=0.1.7",
    "sse-starlette>=2.1",
    "tenacity>=9.1.4",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ambient"]

[tool.uv]
package = true

[dependency-groups]
demo = [
    "anthropic>=0.105",
    "gradio>=5",
]
dev = [
    "modal>=1.3.5",
    "pymilvus[milvus-lite]>=2.6.10",
]
mcp = [
    "mcp>=1.2",
]
